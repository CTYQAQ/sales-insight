<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Sales Insight · social preview</title>
<style>
  /* 1280×640，GitHub 社交预览推荐尺寸。
     左边放品牌与要点，右边放真实界面截图 —— 缩略图在微信里只有巴掌大，
     所以字号要大到缩到 1/4 还能读。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 8% -10%, #eaf2ff 0%, rgba(234, 242, 255, 0) 70%),
      radial-gradient(700px 380px at 100% 110%, #eef7f1 0%, rgba(238, 247, 241, 0) 70%),
      #fbfcfe;
    display: flex;
    align-items: center;
    gap: 48px;
    padding: 0 56px;
    color: #0f172a;
  }

  /* ---------------- 左栏 ---------------- */
  .left {
    width: 430px;
    flex: 0 0 430px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #1668dc;
    background: #e8f1ff;
    border: 1px solid #cfe1ff;
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 22px;
    letter-spacing: 0.02em;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1668dc; }

  h1 {
    font-size: 54px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin-bottom: 14px;
  }
  h1 .accent { color: #1668dc; }

  .sub {
    font-size: 21px;
    color: #475569;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 30px; }
  .chip {
    font-size: 14.5px;
    font-weight: 600;
    color: #334155;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 7px 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14.5px;
    color: #64748b;
    font-weight: 500;
  }
  .pass {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #15803d;
    background: #e9f7ee;
    border: 1px solid #c7ebd3;
    border-radius: 6px;
    padding: 4px 9px;
    font-weight: 700;
  }

  /* ---------------- 右栏：截图 ---------------- */
  .right {
    flex: 1 1 auto;
    height: 520px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 24px 48px -18px rgba(15, 23, 42, 0.28), 0 2px 6px rgba(15, 23, 42, 0.05);
    overflow: hidden;
    position: relative;
  }

  /* 顶栏做成 macOS 风格三点，暗示"这是真实跑起来的界面" */
  .bar {
    height: 34px;
    background: #f8fafc;
    border-bottom: 1px solid #eef2f7;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 13px;
  }
  .bar i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; }
  .bar i:nth-child(3) { background: #28c840; }
  .bar span { margin-left: 10px; font-size: 12px; color: #94a3b8; }

  .shot {
    width: 100%;
    height: calc(520px - 34px);
    /* 用 background 而不是 <img>：可以直接放大并精确框到"问答 + 引用来源"那块。
       源图是 2880×2486（=1440×1243 CSS px），对话面板大致在 x 540~1440、y 60~650。
       缩放到 82%（1184px 宽）正好把这段铺满 740×486 的容器，字够大又不裁掉正文。
       整页缩略图里字太小，社交卡片在微信里只有几百像素宽，必须聚焦。 */
    background-image: url("../docs/screenshots/02-chat-rag.png");
    background-repeat: no-repeat;
    background-size: 1184px auto;
    background-position: -418px -46px;
    display: block;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="badge"><span class="dot"></span>AI 应用 · 全栈</div>

    <h1>Sales <span class="accent">Insight</span></h1>
    <p class="sub">企业销售智能分析平台<br />中文问数 · RAG 知识库 · AI 报告 · 异常告警</p>

    <div class="chips">
      <span class="chip">LangGraph Agent</span>
      <span class="chip">RAG 混合检索</span>
      <span class="chip">Text2SQL 安全围栏</span>
      <span class="chip">FastAPI</span>
      <span class="chip">React 18</span>
    </div>

    <div class="foot">
      <span class="pass">✦ 82 tests passed</span>
      <span>github.com/CTYQAQ/sales-insight</span>
    </div>
  </div>

  <div class="right">
    <div class="bar"><i></i><i></i><i></i><span>对话助手 — 意图路由 + RAG 引用</span></div>
    <div class="shot"></div>
  </div>
</body>
</html>
