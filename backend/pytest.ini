[pytest]
# 让 pytest 从 backend/ 根目录就能 import app 包，不用手动设 PYTHONPATH
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --strict-markers
    --tb=short

# 业务代码里 utf-8 中文很常见，显式指定避免 Windows 控制台报 UnicodeDecodeError
# （Windows 中文环境默认 GBK，pytest 读源文件时会踩到）
filterwarnings =
    ignore::DeprecationWarning
